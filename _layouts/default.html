<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1f2933;
        --muted: #52606d;
        --line: #d9e2ec;
        --paper: #ffffff;
        --wash: #f5f7fa;
        --accent: #0b5cab;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 17px;
        line-height: 1.55;
      }

      header {
        border-bottom: 1px solid var(--line);
        background: var(--wash);
      }

      .wrap {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
      }

      .site-head {
        padding: 22px 0 20px;
      }

      .kicker {
        margin: 0 0 4px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 650;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .site-title {
        margin: 0;
        font-size: clamp(1.55rem, 2.6vw, 2.2rem);
        line-height: 1.18;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        padding: 12px 0;
        border-top: 1px solid var(--line);
      }

      nav a,
      main a {
        color: var(--accent);
      }

      nav a {
        font-size: 0.96rem;
        font-weight: 650;
        text-decoration: none;
      }

      main {
        padding: 34px 0 56px;
      }

      h1,
      h2,
      h3 {
        line-height: 1.25;
      }

      h1 {
        margin: 0 0 20px;
        font-size: clamp(1.8rem, 3vw, 2.55rem);
      }

      h2 {
        margin-top: 36px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        font-size: 1.35rem;
      }

      ul,
      ol {
        padding-left: 1.35rem;
      }

      li {
        margin: 0.4rem 0;
      }

      table {
        display: block;
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
        margin: 1.25rem 0 1.8rem;
        border-collapse: collapse;
        border-spacing: 0;
        font-size: 0.92rem;
      }

      thead,
      tbody {
        display: table;
        min-width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        min-width: 10rem;
        padding: 0.58rem 0.68rem;
        border: 1px solid var(--line);
        vertical-align: top;
      }

      th {
        background: var(--wash);
        text-align: left;
        font-weight: 700;
      }

      tr:nth-child(even) td {
        background: #fbfcfe;
      }

      code,
      pre {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      code {
        font-size: 0.94em;
      }

      pre {
        max-width: 100%;
        overflow-x: auto;
        padding: 0.9rem 1rem;
        border: 1px solid var(--line);
        background: #f8fafc;
        font-size: 0.88rem;
        line-height: 1.5;
      }

      footer {
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.92rem;
        padding: 20px 0 34px;
      }
    </style>
    <style id="compiler-network-style">
      .compiler-network {
        border-bottom: 1px solid rgba(31, 41, 51, 0.14);
        background: #ffffff;
        color: #1f2933;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .compiler-network__inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 9px 0;
      }
      .compiler-network__label {
        color: #52606d;
        font-size: 0.76rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .compiler-network__links {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }
      .compiler-network__links a {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        border: 1px solid #d9e2ec;
        border-radius: 7px;
        padding: 0 9px;
        color: #0b5cab;
        background: #f8fafc;
        font-size: 0.82rem;
        font-weight: 800;
        line-height: 1;
        text-decoration: none;
      }
      .compiler-network__links a:hover {
        border-color: #0b5cab;
        background: #edf6ff;
      }

      .compiler-network__links button {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        border: 1px solid #b8c7d9;
        border-radius: 7px;
        padding: 0 9px;
        color: #1f2933;
        background: #ffffff;
        font: inherit;
        font-size: 0.82rem;
        font-weight: 900;
        line-height: 1;
        cursor: pointer;
      }
      .compiler-network__links button:hover,
      .compiler-network__links button:focus-visible {
        border-color: #0b5cab;
        background: #edf6ff;
        outline: none;
      }
      .compiler-network__links button[data-copied="true"] {
        border-color: #2f675f;
        color: #2f675f;
      }
      @media (max-width: 640px) {
        .compiler-network__inner {
          align-items: flex-start;
          flex-direction: column;
        }
        .compiler-network__links {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="compiler-network" role="navigation" aria-label="Compiler network">
      <div class="compiler-network__inner">
        <span class="compiler-network__label">Compiler Network</span>
        <div class="compiler-network__links">
          <a href="https://therealjameswilson.github.io/Compiler-Assist/" rel="noreferrer">Main Hub</a>
          <a href="https://history.state.gov/historicaldocuments/status-of-the-series" rel="noreferrer">FRUS Status</a>
          <a href="https://therealjameswilson.github.io/nara-scout/" rel="noreferrer">NARA Scout</a>
          <a href="https://therealjameswilson.github.io/strobe-talbott-foia/" rel="noreferrer">Strobe FOIA</a>
          <button class="compiler-network__copy" type="button" data-compiler-handoff>Copy Handoff</button>
        </div>
      </div>
    </div>
    <header>
      <div class="wrap site-head">
        <p class="kicker">Foreign Relations of the United States</p>
        <p class="site-title">{{ site.title }}</p>
      </div>
      <nav class="wrap" aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/persons.html' | relative_url }}">Persons</a>
        <a href="{{ '/reports/' | relative_url }}">Reports</a>
        <a href="https://history.state.gov/historicaldocuments/frus1989-92v02">Official Volume Page</a>
      </nav>
    </header>
    <main class="wrap">
      {{ content }}
    </main>
    <footer>
      <div class="wrap">Working source-discovery site for FRUS 1989-1992, Volume II.</div>
    </footer>
    <script id="compiler-network-script">
      (() => {
        const button = document.querySelector("[data-compiler-handoff]");
        if (!button) return;

        function fallbackCopy(text) {
          const area = document.createElement("textarea");
          area.value = text;
          area.setAttribute("readonly", "");
          area.style.position = "fixed";
          area.style.left = "-9999px";
          document.body.append(area);
          area.select();
          try { document.execCommand("copy"); } finally { area.remove(); }
        }

        function handoffText() {
          const title = document.querySelector("h1")?.textContent.trim() || document.title || "FRUS compiler page";
          return [
            "# " + title,
            "",
            "Page: " + window.location.href,
            "Compiler Assist: https://therealjameswilson.github.io/Compiler-Assist/",
            "FRUS Status: https://history.state.gov/historicaldocuments/status-of-the-series",
            "NARA Scout: https://therealjameswilson.github.io/nara-scout/",
            "Strobe FOIA: https://therealjameswilson.github.io/strobe-talbott-foia/",
            "",
            "Use this note as the starting point for a pull request, source-note check, or compiler handoff."
          ].join("\n");
        }

        button.addEventListener("click", async () => {
          const text = handoffText();
          try {
            if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
            else fallbackCopy(text);
            button.textContent = "Copied";
            button.dataset.copied = "true";
            window.setTimeout(() => {
              button.textContent = "Copy Handoff";
              delete button.dataset.copied;
            }, 1800);
          } catch (error) {
            fallbackCopy(text);
            button.textContent = "Copied";
            button.dataset.copied = "true";
          }
        });
      })();
    </script>
  </body>
</html>
